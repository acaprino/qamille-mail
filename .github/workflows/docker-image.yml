name: Docker image

# Publishes ghcr.io/acaprino/qamille-server (linux/amd64): `develop` and `sha-<short>` at every change of
# server/ or compute/ on develop, `<version>` and `latest` after every successful Release. A tag made by the
# Release workflow with GITHUB_TOKEN starts no workflow, a workflow_run does. The package stays private until
# the owner makes it public in the package settings.

on:
  push:
    branches: [develop]
    paths:
      - server/**
      - compute/**
      - .github/workflows/docker-image.yml
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to build
        default: develop

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image
  cancel-in-progress: false

jobs:
  image:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/acaprino/qamille-server
    steps:
      - name: Find the release tag
        if: github.event_name == 'workflow_run'
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && steps.release.outputs.tag || (github.event.inputs.ref || github.ref) }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Version
        id: version
        run: echo "value=$(node .github/scripts/release.mjs current)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            printf 'list=%s\n' "$IMAGE:${{ steps.version.outputs.value }},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          else
            printf 'list=%s\n' "$IMAGE:develop,$IMAGE:sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          build-args: |
            QAMILLE_VERSION=${{ steps.version.outputs.value }}
            QAMILLE_SOURCE=https://github.com/${{ github.repository }}
      - name: Digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: echo "ghcr.io/acaprino/qamille-server@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
