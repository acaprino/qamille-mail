name: ci

on:
  pull_request:
    branches: [develop]
  # By hand on a branch (Actions, Run workflow): the same checks without a pull request.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            server
            compute
      # The build writes the locks, nobody does by hand (the machines here compile nothing): `cargo fetch` without --locked
      # brings a lock to what its Cargo.toml says (a crate's version, a dependency added) and changes nothing else.
      # --locked below then stops only what it is for: a change in the lock that nobody asked for.
      - name: The locks follow the manifests
        run: |
          cargo fetch --manifest-path server/Cargo.toml
          cargo fetch --manifest-path compute/Cargo.toml
      - name: Server tests
        run: cargo test --manifest-path server/Cargo.toml --jobs 2 --locked --no-fail-fast
      - name: Compute tests
        run: cargo test --manifest-path compute/Cargo.toml --jobs 2 --locked
      - name: Local compose is valid
        env:
          QAMILLE_ADMIN_KEY: ci-only-fake-key-0123456789-abcdefghij
        run: docker compose -f server/compose.local.yaml config -q

  scripts:
    # The release and public-export scripts and the backup of the hosted server: node tests, with bash and openssl.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test ".github/scripts/*.test.mjs"

  app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # The build writes the locks, nobody does by hand (the machines here compile nothing): `cargo fetch` without --locked
      # brings a lock to what its Cargo.toml says (a crate's version, a dependency added) and changes nothing else.
      # --locked below then stops only what it is for: a change in the lock that nobody asked for.
      - name: The lock follows the manifest
        run: cargo fetch --manifest-path app/Cargo.toml
      - name: App tests
        # Every test file runs even after one fails: a failure must not hide the ones after it.
        run: cargo test --manifest-path app/Cargo.toml --no-default-features --features test-support --jobs 2 --locked --no-fail-fast

  desktop:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      # The ArtCraft engines the app imports are downloaded, not committed (AGENTS.md, «Motori ArtCraft»).
      - run: npm run artcraft:sync
      # Sigrid, the design system, the same way (AGENTS.md, «Sigrid»): the latest release of acaprino/sigrid's main.
      # A new runner has no copy of its own, so without a release the job stops here. The token lifts GitHub's rate
      # limit for an anonymous runner.
      - run: npm run sigrid:sync
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm run check
      # Qamille relies only on Sigrid: no file outside PENDING imports what Sigrid already carries.
      - run: node --test tests/only-sigrid.mjs
      - run: npm run test:ui
      # Browser tests of the preview that guard the editions (Edge is on the Windows runner); the sign-in screens
      # they pass through are kept as an artifact, to be looked at.
      - run: npm run test:browser -- onboarding-professional
        env:
          QAMILLE_SHOTS_DIR: ${{ runner.temp }}/screens
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore
          retention-days: 7

  native:
    name: Native Windows shell
    runs-on: windows-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: desktop
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/app/target
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> ../../app/target
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run test:native-feel
      - name: Test native shell rules
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked --jobs 2 --release --features custom-protocol
      - name: Build native executable with embedded UI
        run: cargo build --manifest-path src-tauri/Cargo.toml --locked --jobs 2 --release --features custom-protocol
      - name: Open the packaged application with a synthetic workspace
        env:
          QAMILLE_STARTUP_EXE: ${{ github.workspace }}/app/target/release/qamille-desktop.exe
        run: npm run test:startup:native
