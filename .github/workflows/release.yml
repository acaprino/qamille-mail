name: Release

# A release at every merge of develop into main;
# what is project-specific is in .github/release.json, the version logic in
# .github/scripts/release.mjs.
#   1. the merged pull request's label chooses the step: release:major, release:minor, otherwise patch;
#   2. the next version is written in every version file (and the project's Cargo.lock entries); the first release,
#      when the repository has no release tag yet, is the version the files already have (1.0.0);
#   3. the build runs on the project's runner: build-release.bat --no-install on Windows unless release.json
#      says otherwise;
#   4. the version commit and the tag <prefix><version> go on main (plus the "extraTags" of release.json, such as
#      core-v<version>, the server library the enterprise repository depends on), the GitHub Release gets one
#      file, the desktop client: release\ zipped, installer folder left out (or release/'s files as they are, for
#      "assets": "files"); the server image follows from docker-image.yml, which adds its pull line to the notes;
#   5. main is merged back into develop, so develop carries the new version.
# Nothing is published when the build fails. Run by hand (Actions, Run workflow) it only builds, unless "publish"
# is ticked. RELEASE_TOKEN (a token that reads the owner's other private repositories) is needed where the build
# downloads from them; without it the workflow's own token is used.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      step:
        description: Version step
        type: choice
        options: [patch, minor, major]
        default: patch
      publish:
        description: Publish the release (otherwise build only)
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    # The release commit itself ("release v1.2.3") is pushed by this workflow and must not start another one.
    if: ${{ !startsWith(github.event.head_commit.message, 'release ') }}
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.plan.outputs.runner }}
      step: ${{ steps.plan.outputs.step }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: plan
        shell: pwsh
        run: |
          $config = Get-Content .github/release.json -Raw | ConvertFrom-Json
          $runner = if ($config.runner) { $config.runner } else { 'windows-latest' }
          $step = '${{ inputs.step }}'
          if ('${{ github.event_name }}' -eq 'push') {
            $labels = @(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].labels[].name')
            $step = if ($labels -contains 'release:major') { 'major' } elseif ($labels -contains 'release:minor') { 'minor' } else { 'patch' }
          }
          "runner=$runner" >> $env:GITHUB_OUTPUT
          "step=$step" >> $env:GITHUB_OUTPUT
          Write-Host "Runner $runner, version step $step"

  release:
    needs: plan
    runs-on: ${{ needs.plan.outputs.runner }}
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
      PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Next version
        id: version
        run: |
          $current = node .github/scripts/release.mjs current
          git fetch --tags --quiet
          # The first release has nothing to step from: it is the version already in the files.
          if (git tag --list "$(node .github/scripts/release.mjs config tagPrefix)*") {
            $version = node .github/scripts/release.mjs bump '${{ needs.plan.outputs.step }}'
          } else {
            $version = $current
          }
          if ($LASTEXITCODE -or -not $version) { exit 1 }
          # The first tag is the release's own (v1.2.3); the others (core-v1.2.3) go on the same commit.
          $tags = @(node .github/scripts/release.mjs tags $version)
          if ($LASTEXITCODE -or -not $tags) { exit 1 }
          $tag = $tags[0]
          foreach ($t in $tags) { if (git tag --list $t) { Write-Error "$t already exists"; exit 1 } }
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "tags=$($tags -join ' ')" >> $env:GITHUB_OUTPUT
          "app=$(node .github/scripts/release.mjs config app)" >> $env:GITHUB_OUTPUT
          Write-Host "$current -> $version ($tag)"

      - name: Prepare and build
        run: |
          $commands = @(node .github/scripts/release.mjs config prepare) + @(node .github/scripts/release.mjs config build)
          foreach ($command in $commands) {
            if (-not $command) { continue }
            Write-Host "> $command"
            if ($IsWindows) { cmd /c $command } else { bash -c $command }
            if ($LASTEXITCODE) { exit 1 }
          }

      - name: Package
        run: |
          if ((node .github/scripts/release.mjs config assets) -eq 'files') {
            $assets = @(Get-ChildItem release -File | ForEach-Object FullName)
          } else {
            $zip = "${{ steps.version.outputs.app }}-${{ steps.version.outputs.version }}-windows-x64.zip"
            Compress-Archive -Path (Get-ChildItem release -Exclude installer).FullName -DestinationPath $zip
            # Only the zip: the owner wants the desktop client as one zip, no loose exe and no installer.
            $assets = @((Resolve-Path $zip).Path)
          }
          if (-not $assets) { Write-Error 'release/ is empty'; exit 1 }
          $assets | ForEach-Object { Write-Host $_ }
          ($assets -join "`n") | Set-Content -Path "$env:RUNNER_TEMP/assets.txt"

      - name: Commit, tag and publish
        if: env.PUBLISH == 'true'
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- @(node .github/scripts/release.mjs paths)
          # Empty for the first release, whose version is already in the files.
          git commit --allow-empty -m "release $tag"
          $tags = '${{ steps.version.outputs.tags }}' -split ' '
          foreach ($t in $tags) { git tag -a $t -m "${{ steps.version.outputs.app }} ${{ steps.version.outputs.version }}" }
          git push origin "HEAD:refs/heads/main" @($tags | ForEach-Object { "refs/tags/$_" })
          if ($LASTEXITCODE) { exit 1 }
          $assets = @(Get-Content "$env:RUNNER_TEMP/assets.txt")
          gh release create $tag --repo '${{ github.repository }}' --verify-tag --title "${{ steps.version.outputs.app }} ${{ steps.version.outputs.version }}" --generate-notes @assets
          if ($LASTEXITCODE) { exit 1 }

      - name: develop follows main
        if: env.PUBLISH == 'true'
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          git fetch origin develop
          git switch -C develop origin/develop
          git merge --no-edit -m "Merge $tag into develop" $tag
          if ($LASTEXITCODE) { Write-Error "main could not be merged into develop: merge $tag into develop by hand"; exit 1 }
          git push origin develop
